<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Palette based on site variables: bg-secondary and accent -->
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2E3440" />
      <stop offset="100%" stop-color="#27303a" />
    </linearGradient>
  </defs>
  <!-- Folder tab -->
  <rect x="6" y="14" width="24" height="10" rx="2" fill="#24303a" stroke="#88c0d0" stroke-width="2"/>
  <!-- Folder body -->
  <rect x="6" y="20" width="52" height="36" rx="4" fill="url(#paper)" stroke="#88c0d0" stroke-width="2"/>
  <!-- Retro highlight line -->
  <path d="M10 26 H54" stroke="#88c0d0" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Tiny label dot -->
  <circle cx="52" cy="46" r="2" fill="#88c0d0" />
</svg>
